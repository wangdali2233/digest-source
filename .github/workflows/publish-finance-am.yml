name: publish-finance-am

# 财经晨报：北京时间 05:30，覆盖前 12 小时（美股全天 + 盘后）
on:
  schedule:
    # 主跑 + 一次补跑。实测主跑会晚约 2.3 小时（05:30 → 08:02），
    # 补跑放在 10:47，留出余量且仍在北京日内。
    - cron: "30 21 * * *"   # 主跑  05:30 北京
    - cron: "47 2 * * *"    # 补跑  10:47 北京
  workflow_dispatch:
    inputs:
      date:
        description: "出稿日期 YYYY-MM-DD（留空 = 今天）"
        required: false
        type: string
      force:
        description: "覆盖当天已生成的文件"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    uses: ./.github/workflows/pipeline.yml
    with:
      profile: finance
      slot: morning
      date: ${{ github.event.inputs.date }}
      force: ${{ github.event.inputs.force == 'true' }}
    secrets: inherit
