name: publish-finance-pm

# 财经晚报：北京时间 17:30，覆盖前 12 小时（亚洲时段 + 欧洲开盘）
on:
  schedule:
    # UTC 09:30 = 北京 17:30
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "出稿日期 YYYY-MM-DD（留空 = 今天）"
        required: false
        type: string
      force:
        description: "覆盖当天已生成的文件"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    uses: ./.github/workflows/pipeline.yml
    with:
      profile: finance
      slot: evening
      date: ${{ github.event.inputs.date }}
      force: ${{ github.event.inputs.force == 'true' }}
    secrets: inherit
