name: publish-finance-am

# 财经晨报：北京时间 05:30，覆盖前 12 小时（美股全天 + 盘后）
on:
  schedule:
    # 主跑 + 两次补跑，全部落在同一个北京日内（跨午夜会生成错误日期）
    - cron: "30 21 * * *"   # 北京 05:30
    - cron: "30 1 * * *"    # 北京 09:30（补跑 1）
    - cron: "30 5 * * *"    # 北京 13:30（补跑 2）
  workflow_dispatch:
    inputs:
      date:
        description: "出稿日期 YYYY-MM-DD（留空 = 今天）"
        required: false
        type: string
      force:
        description: "覆盖当天已生成的文件"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    uses: ./.github/workflows/pipeline.yml
    with:
      profile: finance
      slot: morning
      date: ${{ github.event.inputs.date }}
      force: ${{ github.event.inputs.force == 'true' }}
    secrets: inherit
