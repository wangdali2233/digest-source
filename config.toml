# 全局配置：站点、输出、LLM、核心词表
# 栏目自己的东西（发布时刻、窗口、分节、源、配额）在 profiles/<id>.toml

[site]
title = "每日信息"
base_url = "https://wangdali2233.github.io/"
timezone = "Asia/Shanghai"
max_front_tags = 10        # 文章 frontmatter 最多挂几个标签（按频次取前 N）

[output]
# 每个栏目一个子目录，避免同一天文件名相撞
content_dir = "source/_posts/{profile}"
state_file = "data/seen.json"

# 受控词表（核心层，所有栏目共用）：模型只能从这里选标签。
# 栏目可以在 profiles/*.toml 的 [tags].extra 里追加自己的词。
[tags]
max_per_item = 3           # 每条最多几个标签
vocab = [
  "ai", "llm", "agents", "oss", "release", "rust", "python", "javascript",
  "database", "infra", "essay", "security", "linux", "web", "hardware", "science",
  "policy", "startup", "business", "design", "productivity", "graphics",
  "video", "privacy", "mobile",
]

# ---- LLM ----
# 只认 OpenAI 兼容端点（/chat/completions）。换服务商改下面三行即可：
#   Moonshot:   https://api.moonshot.cn/v1/chat/completions   moonshot-v1-8k
#   硅基流动:   https://api.siliconflow.cn/v1/chat/completions  Qwen/Qwen2.5-7B-Instruct
#   自建 vLLM:  http://your-host:8000/v1/chat/completions      你的模型名
# 拿不到密钥时整段失效，自动退回关键词分类，不影响出稿。
# 注意：GitHub Models 已于 2026-07-30 完全下线，不要再指向 models.github.ai。
[llm]
enabled = true
# 默认用哪个 provider。找不到它的密钥时会自动回退到另一个有密钥的。
provider = "openrouter"
limit = 60          # 只把分数最高的这么多条送去分类，控制 token
timeout = 45        # 单次请求超时（socket 级）
retry_deadline = 180  # 重试总预算（秒）。单次超时挡不住「每次都慢」，这个兜住总耗时

# OpenRouter 免费路由。注意它是「路由器」：具体落到哪个免费模型由平台决定，
# 所以输出质量和延迟会有波动。支持 response_format，用 reasoning 参数而不是 thinking。
[llm.openrouter]
endpoint = "https://openrouter.ai/api/v1/chat/completions"
model = "openrouter/free"
key_env = "OPENROUTER_API_KEY"
json_mode = true
thinking = "auto"      # 不要发 thinking 字段，OpenRouter 不认
reasoning = false      # 必须关掉：免费路由默认开推理，会把 max_tokens 烧光、正文返回空
# 路由器偶发落到不兼容后端（线上实测过 400）。每个 json_mode 变体最多重试 3 次，
# 加上降级到「不带 response_format」的那一轮，最坏共 8 次调用——免费模型成本为 0，只花时间。
retries = 3

# 备用：DeepSeek 官方（按量计费，质量更稳定）
[llm.deepseek]
endpoint = "https://api.deepseek.com/chat/completions"
model = "deepseek-flash"
key_env = "DEEPSEEK_API_KEY"
json_mode = true
thinking = "disabled"  # 开着会把 max_tokens 烧在 reasoning 上，正文返回空
retries = 0            # 官方接口稳定，失败重试只是浪费钱

# 高峰省流：北京时间 09:00-12:00 与 14:00-18:00 为高峰，压缩输出；
# 其余时段视为错峰，放开预算。区间可增删，格式 "HH:MM-HH:MM"。
[llm.budget]
peak = ["09:00-12:00", "14:00-18:00"]
peak_limit = 30             # 高峰只送 30 条候选（错峰 60）
peak_max_tokens = 800       # 高峰输出上限
peak_summary_chars = 20     # 高峰摘要压到 20 字
offpeak_max_tokens = 4000
summary_chars = 35
# 摘要阶段单独给预算：条数多、每条都要写，800 不够用
peak_summary_max_tokens = 1600
offpeak_summary_max_tokens = 4000

# 摘要阶段：先抓正文，再让模型写一句话。抓不到就只依据标题写。
[llm.summary]
enabled = true
excerpt_chars = 1200     # 每篇最多取多少字进 prompt
fetch_bytes = 200000     # 单页最多读多少字节
timeout = 12
workers = 8              # 并发抓取数，20 条大约几秒
