on:
  # 调度由外部对账巡检负责（docs/design/002-external-watchdog.md）。
  # 不用 GitHub 的 schedule：实测延迟已到 8 小时以上，补跑会跨午夜生成残缺期。
  workflow_dispatch:
    inputs:
      date:
        description: "生成哪一天（YYYY-MM-DD），留空=今天"
        required: false
        default: ""
      force:
        description: "覆盖已存在的当天文件"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  run:
    uses: ./.github/workflows/pipeline.yml
    with:
      profile: finance
      slot: evening
      date: ${{ github.event.inputs.date }}
      force: ${{ github.event.inputs.force == 'true' }}
    secrets: inherit
