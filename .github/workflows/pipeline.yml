name: pipeline

# 可复用流程：三个触发器（技术 / 财经晨 / 财经晚）都调它。
# 好处是发布步骤只有一份，不会出现「改了 A 忘了 B」。
on:
  workflow_call:
    inputs:
      profile:
        description: "栏目 id（profiles/<id>.toml）"
        required: true
        type: string
      slot:
        description: "时段，仅财经使用：morning / evening"
        required: false
        type: string
        default: ""
      date:
        description: "出稿日期 YYYY-MM-DD，留空为今天"
        required: false
        type: string
        default: ""
      force:
        description: "覆盖当天已生成的文件"
        required: false
        type: boolean
        default: false
    secrets:
      DEEPSEEK_API_KEY:
        required: false
      SITE_DEPLOY_KEY:
        required: true

permissions:
  contents: write

env:
  SITE_REPO: git@github.com:wangdali2233/wangdali2233.github.io.git

jobs:
  publish:
    runs-on: ubuntu-latest
    # 按栏目+时段分组：财经晨报和技术日报互不干扰，也不会互相取消
    concurrency:
      group: ${{ inputs.profile }}-${{ inputs.slot || 'daily' }}
      cancel-in-progress: false

    steps:
      - name: 检出
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成 Markdown
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          ARGS=(--profile "${{ inputs.profile }}")
          if [ -n "${{ inputs.slot }}" ]; then ARGS+=(--slot "${{ inputs.slot }}"); fi
          if [ -n "${{ inputs.date }}" ]; then ARGS+=(--date "${{ inputs.date }}"); fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS+=(--force); fi
          python3 -m pipeline build "${ARGS[@]}"

      - name: 提交 Markdown 与去重状态
        env:
          DIGEST_PROFILE: ${{ inputs.profile }}
          DIGEST_SLOT: ${{ inputs.slot }}
          DIGEST_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          git config user.name  "digest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add source/_posts data/seen.json
          if git diff --cached --quiet; then
            echo "无内容变更，跳过提交"
          else
            DAY="${DIGEST_DATE:-$(TZ=Asia/Shanghai date +%F)}"
            LABEL="$DIGEST_PROFILE${DIGEST_SLOT:+-$DIGEST_SLOT}"
            git commit -m "digest($LABEL): $DAY"
            git push origin HEAD:main
          fi

      - name: 构建站点
        run: |
          npx hexo clean
          npx hexo generate
          # 缺了 .nojekyll，Pages 会用 Jekyll 预处理，下划线开头的路径会 404
          touch public/.nojekyll

      - name: 发布到站点仓库
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_DEPLOY_KEY:-}" ]; then
            echo "缺少 SITE_DEPLOY_KEY，请先在仓库 Secrets 里配置 deploy key" >&2
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SITE_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          cd public
          git init -q -b main
          git remote add origin "$SITE_REPO"
          git add -A
          git -c user.name="digest-bot" \
              -c user.email="bot@users.noreply.github.com" \
              commit -qm "publish: source@${GITHUB_SHA::7}"
          git push -f origin main
