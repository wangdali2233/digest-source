name: publish-tech

# 技术信息聚合：每天 07:17（北京），内容窗口到 07:00 为止
on:
  schedule:
    # 主跑 + 一次补跑。实测 GitHub 计划任务会晚约 2.3 小时（07:17 → 09:34），
    # 补跑放在 11:47，留出余量且仍在北京日内；文件已存在就跳过，十几秒结束。
    - cron: "17 23 * * *"   # 主跑  07:17 北京
    - cron: "47 3 * * *"    # 补跑  11:47 北京
  workflow_dispatch:
    inputs:
      date:
        description: "出稿日期 YYYY-MM-DD（留空 = 今天）"
        required: false
        type: string
      force:
        description: "覆盖当天已生成的文件"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    uses: ./.github/workflows/pipeline.yml
    with:
      profile: tech
      date: ${{ github.event.inputs.date }}
      force: ${{ github.event.inputs.force == 'true' }}
    secrets: inherit
