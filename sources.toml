# 每日信息聚合 · 采集与编排配置

[site]
title = "技术信息聚合"
base_url = "https://wangdali2233.github.io/"
timezone = "Asia/Shanghai"
publish_at = "07:00"     # 每期出稿时刻，也是时间窗的右边界
window_hours = 24        # 窗口 = [出稿时刻 - 24h, 出稿时刻)
window_slack_hours = 6   # 额外向前放宽，避免跑晚了导致 feed 全军覆没

[output]
content_dir = "source/_posts"
state_file = "data/seen.json"

[quota]
daily = 12               # 每期总条数上限
per_section = 4          # 每个分节的条数上限
max_other = 4            # 「其他」桶的独立上限。单源（HN）时泛技术条目多，
                         # 实测 47 条里约 64% 不属于任何固定分节，卡太紧会浪费配额
min_items = 3            # 少于这个数就中止发布，宁可停更
seen_days = 7            # 同一链接多少天内不重复

# 正文分节：固定顺序，渲染时按这个顺序出 ## 标题
[[sections]]
id = "ai"
title = "AI / 模型"
desc = "大模型、训练与推理、AI 公司动态、论文、算力"
keywords = ["ai", "llm", "gpt", "claude", "模型", "训练", "推理", "agent", "diffusion", "token", "transformer"]
domains = ["arxiv.org", "openai.com", "anthropic.com", "huggingface.co"]

[[sections]]
id = "oss"
title = "开源 / 工具"
desc = "开源项目、开发者工具、编程语言与框架、版本发布"
keywords = ["github", "开源", "open source", "cli", "tool", "编辑器", "rust", "python", "javascript", "release"]
domains = ["github.com", "gitlab.com", "crates.io", "pypi.org"]

[[sections]]
id = "infra"
title = "基础设施"
desc = "数据库、网络、云服务、运维、性能、安全"
keywords = ["database", "数据库", "索引", "kubernetes", "k8s", "latency", "性能", "存储", "linux", "deploy", "server", "cdn"]
domains = ["blog.cloudflare.com", "aws.amazon.com", "kubernetes.io"]

[[sections]]
id = "essay"
title = "长文 / 观点"
desc = "观点、随笔、访谈、视频、科技与社会、非技术但值得读的深度内容"
keywords = ["why", "essay", "观点", "思考", "反思", "how i", "blog", "技术债"]
domains = ["simonwillison.net", "paulgraham.com"]

[other]
title = "其他"

# ---- 源 ----
# 目前只启用 HN。加 RSS 源时追加一个 [[sources]] 块即可：
#   id / name / kind = "rss" / url / weight / default_section
# kind 支持：hn_algolia（HN 全天窗口查询）、rss（RSS 2.0 / Atom 通用）
# weight 决定跨源排序时的相对权重，调到 0 等于静音该源

[[sources]]
id = "hn"
name = "Hacker News"
kind = "hn_algolia"
weight = 1.0
min_points = 80
limit = 100

# ---- LLM 分节 ----
# 只认 OpenAI 兼容端点（/chat/completions）。换服务商改下面三行即可：
#   Moonshot:   https://api.moonshot.cn/v1/chat/completions   moonshot-v1-8k
#   硅基流动:   https://api.siliconflow.cn/v1/chat/completions  Qwen/Qwen2.5-7B-Instruct
#   自建 vLLM:  http://your-host:8000/v1/chat/completions      你的模型名
# 拿不到密钥时整段失效，自动退回关键词分类，不影响出稿。
# 注意：GitHub Models 已于 2026-07-30 完全下线，不要再指向 models.github.ai。
[llm]
enabled = true
endpoint = "https://api.deepseek.com/chat/completions"
model = "deepseek-chat"
key_env = "DEEPSEEK_API_KEY"
limit = 60          # 只把分数最高的这么多条送去分类，控制 token
json_mode = true    # 首次请求用 response_format，不支持时自动去掉重试
timeout = 90
