name: publish-tech

# 技术信息聚合：每天 07:17（北京），内容窗口到 07:00 为止
on:
  schedule:
    # 主跑 + 两次补跑。GitHub 的计划任务是 best-effort：实测会晚 2.5 小时甚至丢单。
    # 补跑靠幂等保护兜底——文件已存在就直接跳过，十几秒结束。
    # 所有时间点都必须在同一个北京日内，否则跨午夜会生成错误日期的内容。
    - cron: "17 23 * * *"   # 07:17 北京
    - cron: "17 3 * * *"    # 11:17 北京（补跑 1）
    - cron: "17 7 * * *"    # 15:17 北京（补跑 2）
  workflow_dispatch:
    inputs:
      date:
        description: "出稿日期 YYYY-MM-DD（留空 = 今天）"
        required: false
        type: string
      force:
        description: "覆盖当天已生成的文件"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    uses: ./.github/workflows/pipeline.yml
    with:
      profile: tech
      date: ${{ github.event.inputs.date }}
      force: ${{ github.event.inputs.force == 'true' }}
    secrets: inherit
